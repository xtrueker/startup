name: CI Monorepo — API, Mobile & Web

on:
  push:
    branches:
      - main
      - andres
      - Nyck
  pull_request:
    branches:
      - main
      - andres
      - Nyck
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend API (Build & Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run offline unit & security middleware tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_minimum_32_characters_long
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_KEY: ci_placeholder_key
        run: npm run test:unit

  mobile:
    name: Mobile App (TypeScript Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  web:
    name: Web Command Center (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Vite production build
        run: npm run build
