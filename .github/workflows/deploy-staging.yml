name: Deploy Staging to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  ARTIFACT_REPO: red-ciudadana-repo
  IMAGE_NAME: api-core

jobs:
  deploy-staging:
    name: Build & Deploy Microservices
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      run: |
        cd apps/api
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Deploy Evidence Worker (Staging)
      run: |
        gcloud run deploy evidence-worker-stg \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --no-allow-unauthenticated \
          --command="node" --args="dist/workers/EvidenceWorker.js" \
          --min-instances 0 --max-instances 50 \
          --cpu 1 --memory 1024Mi \
          --set-env-vars="COMPONENT_ROLE=EVIDENCE_WORKER,NODE_ENV=staging,BUCKET_NAME=${{ env.PROJECT_ID }}-evidence-stg,REDIS_URL=${{ secrets.REDIS_URL }},MONGODB_URI=${{ secrets.MONGODB_URI }}"

    - name: Deploy Spatial Worker (Staging)
      run: |
        gcloud run deploy spatial-worker-stg \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --no-allow-unauthenticated \
          --command="node" --args="dist/workers/SpatialRoutingWorker.js" \
          --min-instances 1 --max-instances 200 \
          --cpu 4 --memory 4096Mi \
          --set-env-vars="COMPONENT_ROLE=SPATIAL_WORKER,NODE_ENV=staging,REDIS_URL=${{ secrets.REDIS_URL }},MONGODB_URI=${{ secrets.MONGODB_URI }}"

    - name: Deploy API Gateway (Staging)
      run: |
        gcloud run deploy api-gateway-stg \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --allow-unauthenticated --port 3001 \
          --min-instances 2 --max-instances 1000 \
          --concurrency 1000 \
          --cpu 2 --memory 2048Mi \
          --set-env-vars="COMPONENT_ROLE=GATEWAY,NODE_ENV=staging,JWT_SECRET=${{ secrets.JWT_SECRET }},REDIS_URL=${{ secrets.REDIS_URL }},MONGODB_URI=${{ secrets.MONGODB_URI }}"
