$kind: http-request
name: 'Update Operator'
method: PATCH
url: '{{baseUrl}}/api/operators/:id'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{operatorId}}'
body:
  type: json
  content: |-
    {
      "status": "en_servicio",
      "shift": "tarde",
      "consoleStation": "Consola Bravo-03 (Despacho)",
      "zoneAssigned": "Sector Norte - Cuadrante 3"
    }
