$kind: http-request
name: 'Update Alert Status'
method: PATCH
url: '{{baseUrl}}/api/alerts/:id/status'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{alertId}}'
body:
  type: json
  content: |-
    {
      "status": "resolved"
    }
