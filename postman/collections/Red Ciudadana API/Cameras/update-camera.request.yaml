$kind: http-request
name: 'Update Camera'
method: PUT
url: '{{baseUrl}}/api/cameras/:id'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{cameraId}}'
body:
  type: json
  content: |-
    {
      "name": "Cámara Centro Actualizada",
      "status": "inactive"
    }
