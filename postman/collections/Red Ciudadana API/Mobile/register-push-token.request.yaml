$kind: http-request
name: 'Register Device Push Token (FCM / APNs / Expo)'
method: POST
url: '{{baseUrl}}/api/mobile/push-token'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "expoPushToken": "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]",
      "platform": "android"
    }
