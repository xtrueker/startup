$kind: http-request
name: 'Send Live Location'
method: POST
url: '{{baseUrl}}/api/mobile/location'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
    description: Optional — works without auth (anonymous fallback)
body:
  type: json
  content: |-
    {
      "alertId": "{{alertId}}",
      "latitude": 4.7110,
      "longitude": -74.0721,
      "accuracy": 10,
      "speed": 0,
      "heading": 90
    }
