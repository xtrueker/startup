$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "juan@example.com",
      "password": "MiClave123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.success && res.data && res.data.token) {
        pm.collectionVariables.set('token', res.data.token);
        pm.collectionVariables.set('userId', res.data.user.id);
        console.log('Token and userId saved to collection variables');
      }
