<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portada - Red Ciudadana de Seguridad</title>
    <style>
        body { 
            font-family: 'Times New Roman', Times, serif; 
            line-height: 1.5; 
            color: #000; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 50px 20px;
            text-align: center;
        }
        
        .page {
            border: 1px solid #fff; /* Oculto, solo para estructura */
            min-height: 900px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title-section {
            margin-top: 100px;
        }

        h1 { 
            font-size: 20px; 
            font-weight: bold; 
            text-transform: uppercase; 
            margin-bottom: 50px;
        }

        .author-section {
            margin-top: 80px;
        }

        .author-name {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tutor-section {
            margin-top: 100px;
        }

        .tutor-text {
            font-size: 16px;
        }

        .tutor-name {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .institution-section {
            margin-top: 150px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
        }

        p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="page">
        <!-- TÍTULO DEL PROYECTO -->
        <div class="title-section">
            <h1>RED CIUDADANA DE SEGURIDAD:<br> PLATAFORMA DE INTEGRACIÓN TECNOLÓGICA Y VIDEOVIGILANCIA DISTRIBUIDA</h1>
        </div>

        <!-- AUTOR -->
        <div class="author-section">
            <p>Presentado por:</p>
            <p class="author-name">ANDRÉS GUILLEN</p>
        </div>

        <!-- DOCENTE / DIRECTOR -->
        <div class="tutor-section">
            <p class="tutor-text">Trabajo de grado presentado al docente:</p>
            <p class="tutor-name">DANIEL POSEE</p>
        </div>

        <!-- INSTITUCIÓN -->
        <div class="institution-section">
            <p>INSTITUTO UNIVERSITARIO DE LA PAZ - UNIPAZ</p>
            <p>ESCUELA DE INGENIERÍA</p> <!-- Ajusta esto si es otra escuela/facultad -->
            <p>BARRANCABERMEJA</p>
            <p>2026</p> <!-- Cambia el año si es necesario -->
        </div>
    </div>

</body>
</html>
